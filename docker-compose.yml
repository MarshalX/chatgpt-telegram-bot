services:
  bot:
    build: .
    image: chatgptbot
    container_name: chatgptbot
    restart: unless-stopped
    environment:
      - DD_API_KEY=${DD_API_KEY}
      - DD_SITE=${DD_SITE:-datadoghq.eu}
      - DD_SERVICE=${DD_SERVICE:-chatgptbot}
      - DD_LLMOBS_ENABLED=${DD_LLMOBS_ENABLED:-1}
      - DD_LLMOBS_AGENTLESS_ENABLED=${DD_LLMOBS_AGENTLESS_ENABLED:-1}
      - DD_LLMOBS_ML_APP=${DD_LLMOBS_ML_APP:-chatgptbot}
    volumes:
      - .:/usr/bot
    deploy:
      resources:
        limits:
          memory: 512M
